<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Azure Web App - Rotha Mom</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #2a2a3a;
      --accent: #5b8cff;
      --accent2: #a78bfa;
      --text: #e8e8f0;
      --muted: #6b6b8a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.35;
      z-index: 0;
    }

    .glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.12;
      z-index: 0;
      animation: drift 8s ease-in-out infinite alternate;
    }
    .glow-1 { background: var(--accent); top: -200px; left: -100px; }
    .glow-2 { background: var(--accent2); bottom: -200px; right: -100px; animation-delay: -4s; }

    @keyframes drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(40px, 30px); }
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 56px 64px;
      max-width: 600px;
      width: 90%;
      text-align: center;
      animation: fadeUp 0.8s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(91,140,255,0.12);
      border: 1px solid rgba(91,140,255,0.3);
      color: var(--accent);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 28px;
      animation: fadeUp 0.8s 0.1s cubic-bezier(.16,1,.3,1) both;
    }

    .dot {
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.7); }
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #fff 30%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fadeUp 0.8s 0.2s cubic-bezier(.16,1,.3,1) both;
    }

    p {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.7;
      margin-bottom: 40px;
      animation: fadeUp 0.8s 0.3s cubic-bezier(.16,1,.3,1) both;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 40px;
      animation: fadeUp 0.8s 0.4s cubic-bezier(.16,1,.3,1) both;
    }

    .info-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: left;
    }

    .info-label {
      color: var(--muted);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .info-value {
      color: var(--text);
      font-size: 0.85rem;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #4ade80;
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      animation: fadeUp 0.8s 0.5s cubic-bezier(.16,1,.3,1) both;
    }

    .status-dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
      animation: pulse 1.4s ease-in-out infinite;
    }
  </style>
</head>
<body>

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="card">
    <div class="badge">
      <span class="dot"></span>
      Azure App Service
    </div>

    <h1>Hello from Azure!</h1>

    <p>
      This web app was deployed using GitHub Actions CI/CD pipeline<br>
      to Microsoft Azure App Service.
    </p>

    <div class="info-grid">
      <div class="info-item">
        <div class="info-label">App Name</div>
        <div class="info-value">rotha-mom</div>
      </div>
      <div class="info-item">
        <div class="info-label">Runtime</div>
        <div class="info-value">Node 24 LTS</div>
      </div>
      <div class="info-item">
        <div class="info-label">Branch</div>
        <div class="info-value">main</div>
      </div>
      <div class="info-item">
        <div class="info-label">Platform</div>
        <div class="info-value">Linux</div>
      </div>
    </div>

    <div class="status-bar">
      <span class="status-dot"></span>
      Deployment successful — live and running
    </div>
  </div>

</body>
</html>
